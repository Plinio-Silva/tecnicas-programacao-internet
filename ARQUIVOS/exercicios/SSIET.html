<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSIET - Sistema de Inscrição para Eventos de Tecnologia</title>
</head>
<body>
    <header>
        <h1>SSIET — Sistema de Inscrição para Eventos de Tecnologia</h1>
    </header>

    <main>
        <form action="processar.php" method="post" novalidate>
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required pattern="[0-9+()\-\s]{6,}"><br><br>

                <label for="evento">Evento:</label>
                <select id="evento" name="evento" required>
                    <option value="">-- selecione --</option>
                    <option value="palestra-ia">Palestra: Inteligência Artificial</option>
                    <option value="workshop-web">Workshop: Desenvolvimento Web</option>
                    <option value="hackathon">Hackathon</option>
                </select><br><br>
            </fieldset>

            <fieldset>
                <legend>Perfil Profissional</legend>

                <label for="experiencia">Experiência:</label><br>

                <input type="radio" id="iniciante" name="experiencia" value="iniciante" required>
                <label for="iniciante">Iniciante</label><br>

                <input type="radio" id="intermediario" name="experiencia" value="intermediario">
                <label for="intermediario">Intermediário</label><br>

                <input type="radio" id="avancado" name="experiencia" value="avancado">
                <label for="avancado">Avançado</label>
            </fieldset>

            <fieldset>
                <legend>Tecnologia de Interesse</legend>

                <input type="checkbox" id="java" name="tecnologia[]" value="java">
                <label for="java">Java</label><br>

                <input type="checkbox" id="python" name="tecnologia[]" value="python">
                <label for="python">Python</label><br>

                <input type="checkbox" id="javascript" name="tecnologia[]" value="javascript">
                <label for="javascript">JavaScript</label><br>

                <input type="checkbox" id="cloud" name="tecnologia[]" value="cloud">
                <label for="cloud">Cloud Computing</label><br><br>

                <label for="observacoes">Mensagem:</label><br>
                <textarea id="observacoes" name="observacoes" rows="4" cols="40"></textarea><br><br>

                <button type="submit">Enviar inscrição</button>
                <button type="reset">Limpar formulário</button>
            </fieldset>
        </form>
    </main>
</body>
</html>
