<!DOCTYPE html>
<!-- 
    <!Doctype html>
    -> "Document Type"
    -> Diz  ao navegador que este arquivo usa HTML5.
    -> Não é uma Tag, é uma instrução
    -->

<html lang="pt-BR">
<!--
    <html> ... </html>
    -> Tag raiz: tudo dentro dela é HTML.
    -> lang+"pt-BR" é o atributo que indicao idioma da página.
 -->
<head>
    <!--
    <head> 
        -> Parte "interna" do documento.
        -> Não aparece na tela.
        - Guarda configurações, título e meta-informações da página.
    -->

    <meta charset="UTF-8">
    <!-- 
        <meta>
        -> tag de metadados, que não aparece na tela.
        -> chrset="UTF-8" define o padrão de caracteres da pa´gina como UFT-8, que é o mais usado na web.
        -> Permite acento e caracters especiais.
     -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curríclo</title>
    <!-- 
        <title>
            -> Título da aba do navegador..
            -> Nção aparece no corpo da pa´gina.
    -->

</head>

<body>
    <!-- Início do conteúdo visível da página -->

    <!-- ==================================-->
            CABEÇALHO DO CURRÍCULO
    <!-- ==================================-->

    <header>
        <!--
        <header>
            -> Seção de cabeçalho do documento.
            -> Usada para informações de identificação do documento e informações iniciais ou de topo.
    -->

        <h1>Plínio Tiago da Silva</h1>
        <!-- <h1>
            -> Heading nível 1.
            -> Título principal do documento.
            -> h1 é o mais importante, h6 é o menos importante.
    -->

        <p>Email: pliniotiagos@gmail.com</p>
        <!-- 
        <p>
            -> parégrafo.
            -> Usado para textos comuns.
    -->

         <p> Telefone: (92) 99999-9999</p>
         <p>Cidade: Manus - AM</p>
         <!--
         <p>
            -> Parágrafo.
            -> Usado para textos comuns.
    -->
         </header>

         <hr>
         <!--
         <hr>
         -> linha horizontal.
         -> Linha de seção visual, usada para separar seções do documento.
    -->

    <section>
        <!--
        <section>
            -> Seção do documento usado para agrupar conteúdo.
            -> Ajuda na organização semântica do documento.
    -->
            
    </section>
    
</body>
</html>
