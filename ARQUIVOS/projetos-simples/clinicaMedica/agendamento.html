<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>V.I.D.A. - Agendamento</title>
</head>
<body>
    <header>
        <h1>Agendamento</h1>
        <nav>
            <ul>
                <li><a href="clinicaMedica.html">Home</a></li>
                <li><a href="especialidades.html">Especialidades</a></li>
                <li><a href="medicos.html">Médicos</a></li>
                <li><a href="convenios.html">Convênios</a></li>
                <li><a href="agendamento.html">Agendamento</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Agende sua consulta</h2>
            <p>Preencha os dados abaixo para solicitar o melhor dia e horário para a sua consulta.</p>
            <form action="#" method="post">
                <fieldset>
                    <legend>Dados do paciente</legend>
                    <p><label>Nome:<br><input type="text" name="nome" required></label></p>
                    <p><label>CPF:<br><input type="text" name="cpf" required></label></p>
                    <p><label>Data de Nascimento:<br><input type="date" name="nascimento" required></label></p>
                </fieldset>
                <fieldset>
                    <legend>Consulta</legend>
                    <p><label>Especialidade:<br>
                        <select name="especialidade" required>
                            <option value="">Selecione</option>
                            <option value="clinica-geral">Clínica Geral</option>
                            <option value="pediatria">Pediatria</option>
                            <option value="cardiologia">Cardiologia</option>
                            <option value="dermatologia">Dermatologia</option>
                            <option value="ginecologia">Ginecologia</option>
                            <option value="ortopedia">Ortopedia</option>
                        </select>
                    </label></p>
                    <p><label>Médico:<br>
                        <select name="medico" required>
                            <option value="">Selecione</option>
                            <option value="dr-rafael-costa">Dr. Rafael Costa</option>
                            <option value="dra-amanda-alves">Dra. Amanda Alves</option>
                            <option value="dra-paula-mendes">Dra. Paula Mendes</option>
                            <option value="dr-lucas-santos">Dr. Lucas Santos</option>
                            <option value="dra-mariana-pereira">Dra. Mariana Pereira</option>
                        </select>
                    </label></p>
                    <p><label>Data:<br><input type="date" name="data" required></label></p>
                    <p><label>Horário:<br>
                        <select name="horario" required>
                            <option value="">Selecione</option>
                            <option value="08:00">08:00</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                        </select>
                    </label></p>
                    <p><label>Convênio:<br>
                        <select name="convenio" required>
                            <option value="">Selecione</option>
                            <option value="amil">Amil</option>
                            <option value="bradesco">Bradesco Saúde</option>
                            <option value="sulamerica">SulAmérica</option>
                            <option value="unimed">Unimed</option>
                            <option value="porto-seguro">Porto Seguro Saúde</option>
                        </select>
                    </label></p>
                    <p><label>Primeira consulta:<br>
                        <select name="primeira_consulta" required>
                            <option value="">Selecione</option>
                            <option value="sim">Sim</option>
                            <option value="nao">Não</option>
                        </select>
                    </label></p>
                    <p><label>Observações:<br><textarea name="observacoes"></textarea></label></p>
                </fieldset>
                <p><button type="submit">Solicitar Agendamento</button></p>
            </form>
        </section>
    </main>

    <footer>
        <p>V.I.D.A. - Agendamento rápido e fácil para sua saúde.</p>
    </footer>
</body>
</html>
